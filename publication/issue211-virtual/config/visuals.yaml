  official-cam-validation:
  - id: virtual-frame-path
    topic: virtual-principle
    kind: flow
    title: 패턴 생성에서 cam의 완료 알림까지
    generation: llm
    max_nodes: 11
    max_label_chars: 44
    condition_display: evidence
    required_symbols:
    - exportFrameBuffers
    - queueRequest
    - queueRequestDevice
    - MappedFrameBuffer
    - ARGBToNV12
    - generateFrame
    - bufferCompleted
    - completeBuffer
    - completeRequest
    - requestCompleted
    - PipelineHandlerVirtual::bufferCompleted
    question: 선택한 NV12 가상 캡처에서 실제 버퍼 준비와 요청 전달, CPU 패턴 쓰기, 버퍼·요청 완료 및 cam 콜백은 어떻게 연결됩니까?
    prompt: '선택한 Virtual2 NV12 가상 캡처의 핵심 원리를 11개 노드로 설명하세요. schema가 고정한 symbol과 실제 quote_ids를 보존하되 화면 라벨에는 함수명 접두사를 쓰지 말고
      짧은 동작·판정만 한영 각각 44자 이내로 씁니다. 앞부분은 캡처 전 DMA-BUF 준비, 버퍼가 붙은 요청 제출, 준비된 요청의 가상 비동기 전달, 쓰기 방향 CPU 접근 동기화와 쓰기 가능한 DMA-BUF
      매핑, 소프트웨어 줄무늬 템플릿의 CPU NV12 변환 시도, 생성·변환 결과 판정 순서입니다. MappedFrameBuffer 노드는 쓰기 매핑을, ARGBToNV12 노드는 소프트웨어 패턴을 CPU가 NV12로
      변환해 매핑된 버퍼에 기록하려는 시도를 보여 주세요. Virtual2·NV12·CPU를 라벨에 유지하세요. generateFrame 노드는 선택한 NV12 변환 함수의 반환값이 0이 아닌가를 판정합니다. 별도의
      CPU 메모리 쓰기 오류 검사나 모든 오류를 잡는 검사라고 쓰지 마세요. 변환 결과 true(0 아님)는 버퍼 프레임 메타데이터 FrameError 설정, false(0)는 FrameSuccess 유지 후 같은
      버퍼 완료 신호로 이어집니다. 신호는 연결된 핸들러가 받아 요청의 모든 버퍼가 완료됐는지를 completeBuffer 심볼의 결정에서 검사합니다. true면 현재 요청 완료 표시·제출 순서 확인으로, false면
      이번 핸들러 호출만 끝나는 말단으로 갑니다. 마지막 필수 심볼 PipelineHandlerVirtual::bufferCompleted는 말단이며 나가는 간선이 없습니다. 완료 표시에서 cam 콜백으로 가는 선은
      순서가 된 완료 요청에 한해 신호를 보낸다는 요약이며, 앞선 요청이 아직 미완료이면 뒤 통지를 보류하는 조건을 짧게 유지합니다. 모든 11개 노드를 연결하고 두 실제 결정의 true/false 결과를 모두 표시하세요.
      전체 큐 순회·후속 큐 처리·일반 호출자의 취소·내부 반환 0 설명은 생략합니다. 사전 준비에서 요청 제출, 요청 제출에서 가상 전달, 가상 전달에서 매핑, 매핑에서 CPU 변환, CPU 변환에서 결과 판정으로
      가는 선은 핵심 경로 요약이므로 condition_ref always를 사용합니다. 준비 여부나 스트림 찾기 assert를 별도 분기로 그리지 마세요. 실제 두 결정에만 source-bound condition_ref를
      사용하세요. 라벨에 = ! < > 기호를 직접 쓰지 않습니다. Edge 인용은 양 끝의 symbol을 모두 포함해야 하므로 함수 선언이 다른 구절에 있으면 선언 구절도 함께 인용하세요. 예를 들어 virtual-queue:0에
      queueRequestDevice 선언이 있습니다. 영어 once/only once를 쓰지 마세요. 최신 독립 Terra 지적 두 곳만 바로잡습니다. DMA-BUF 준비의 주체는 cam과 virtual 파이프라인이며
      Virtual2 설정 자체가 할당하는 행위자로 쓰이지 않게 하세요. 첫 노드는 cam이 virtual 파이프라인을 통해 버퍼를 확보함을 한영 모두 짧게 명시합니다. MappedFrameBuffer 노드는 쓰기
      동기화가 끝난 뒤 매핑한다는 의미가 아니라 CPU 쓰기 동기화 범위 안의 쓰기 매핑임을 표현하세요. 이어지는 CPU 변환도 같은 쓰기 동기화 범위 안에서 이뤄짐을 그 연결선에서 짧게 유지합니다. sync, then
      또는 동기화 후 같은 완료 선행 표현을 쓰지 마세요. 나머지 올바른 11개 노드·11개 연결선과 두 결정의 결과·인용·순서 통지 조건은 보존합니다. 최신 지적: requestCompleted 심볼 노드와 마지막
      통지 선은 한영 모두 제출 순서 또는 큐에 넣은 순서를 명시하세요. 완료 순서와 혼동하지 말고 completion order 표현은 쓰지 않습니다. 동작은 노드에서 설명하므로 연결선은 짧은 연결·결정 결과만
      씁니다. 특히 매핑→변환 선은 같은 동기화 범위 안이라는 짧은 말만 쓰고 NV12 CPU 변환 동작을 길게 반복하지 마세요. 변환 성공·실패 선은 버퍼 상태 결과를 짧게 표시하며 다음 공통 노드의 완료 신호
      설명을 반복하지 않습니다. 다른 올바른 의미·연결·인용을 보존하세요. 최종 가독성 지적: 모든 버퍼 완료 결정의 true/false 선은 짧은 결과만 표시하고 다음 노드의 요청 완료 표시 동작을 반복하지 마세요.
      completeRequest 심볼 노드는 현재 요청 완료 표시 단계로만 짧게 요약하되 그 함수가 그 동작만 한다는 뜻의 only는 쓰지 않습니다. 그 다음 통지 노드에는 cam 콜백과 제출 순서를 짧게 남기고,
      마지막 선에는 앞선 미완료 요청이 없을 때만 진행하며 그렇지 않으면 보류된다는 조건만 짧게 남겨 노드의 통지 동작을 반복하지 마세요. 의미·인용·연결·다른 라벨을 보존하고 선은 한국어 약 16자·영어 약 32자를
      우선합니다.'
    sources:
    - virtual-buffer-allocation
    - virtual-queue
    - virtual-frame
    - pattern-frame
    - virtual-completion
    - pipeline-dispatch
    - pipeline-completion
    - camera-notification
    - cam-request-buffers
    - cam-signal-connection
    - allocator-to-camera
    - camera-export
    - camera-queue
    - virtual-start
    - pipeline-register
    - virtual-purpose
    - virtual2-config
    while_conditions: true
    answer_contract:
      basis: implementation
      reject_patterns:
      - pattern: cancelRequest|취소
        message: 이 가상 queueRequestDevice는 0을 반환합니다. 일반 호출자의 오류 취소를 가상 경로 라벨에 섞지 마세요.
