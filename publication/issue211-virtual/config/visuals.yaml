  - id: completion-flow
    topic: flow
    kind: decision
    title: 완료 알림에서 후속 처리까지
    generation: llm
    max_nodes: 10
    required_symbols:
    - requestComplete
    - RequestCancelled
    - return
    - callLater
    - processRequest
    - captureCount_
    - captureLimit_
    - captureDone
    - requeue
    - queueRequest
    question: 취소 반환, 이벤트 루프 전달, 진입 한도 검사, 프레임 처리·증가 뒤 완료 신호 또는 재큐까지는 어떻게 이어집니까?
    prompt: '열 노드의 기존 올바른 순서와 condition_ref를 유지하고 개발자용 라벨만 간결하게 다듬으세요. requestComplete, 취소 여부, 현재 함수 반환, callLater, processRequest
      진입 한도, 프레임 처리와 개수 증가, 증가 후 한도, captureDone, sink 보유 여부, reuse와 queueRequest 순서입니다. 소스의 !requeue 결정은 sink가 요청을 보유하는가라는
      긍정형 질문으로 한영 모두 표현하세요. !requeue true는 sink가 보유하므로 현재 함수에서 반환하고 이후 완료 처리에 맡깁니다. false는 재사용 후 queueRequest입니다. 분기 간선은 참/거짓을
      반복하지 말고 취소/정상, 한도 도달/계속, 보유/반환 등 해당 상황을 한영으로 짧게 표현하되 실제 condition_ref의 의미를 정확히 보존하세요. 두 한도 조건은 설정 AND 도달이며 false는 미설정
      또는 미도달을 포함합니다. 취소와 진입 한도 반환은 captureDone을 내지 않습니다. 정확한 조건식과 !requeue는 근거 표에 보존되므로 본 그림의 라벨에 나열하지 마세요. 기존 노드 수와 구조, 올바른
      호출 이름을 유지하세요. 노드 한국어 30자 영어 60자, 간선 한국어 12자 영어 28자 이내입니다. 이번 수정은 올바른 기존 흐름·분기·조건을 보존하며 한영 라벨만 짧게 정리합니다. 라벨에 전체 문장·중복
      해명·번호를 쓰지 말고 행동이나 판정만 씁니다. 한글 노드 24자·영문 48자 안팎, 간선은 더 짧게 쓰되 재현 조건 판정 노드에 필요한 기록된 시험 커널·root의 /dev/udmabuf 접근·Virtual2
      400x300 NV12 조건은 한영 모두 유지합니다. 긴 식별자 중간 줄바꿈을 피하고 개별 영문 토큰은 28자 이내로 씁니다. 최신 Terra 지적: processRequest의 진입 한도 검사 뒤 프레임 처리·개수
      증가 노드에서 선택적인 sink 처리와 requeue 판단 저장이 먼저 이뤄짐을 명시하세요. 증가 후 한도 검사 뒤의 sink 보유 결정은 이미 저장된 requeue 값의 검사임을 한영 모두 분명히 하고 여기서
      sink를 다시 호출하거나 처음 처리하는 것처럼 쓰지 마세요. 기존 올바른 조건·순서·나머지 노드는 보존하세요. 최신 검토 지적을 반영합니다. 마지막 재사용·queueRequest 노드와 그 진입 선은 무조건
      재큐가 아니라 버퍼 유지 재사용 후 재제출 시도임을 한영 모두 표시하세요. 제출 횟수 한도에 이미 도달했으면 실제 큐잉이 생략되는 guard가 있음을 마지막 상자의 짧은 라벨로 나타내고 submission-limit
      근거를 인용하세요. 새 소스가 추가돼 조건 ID가 달라질 수 있으므로 현재 목록의 ID로 기존 조건 의미를 보존하고 과거 cN 번호를 그대로 복사하지 마세요. 이전 두 processRequest 처리 한도 판정과
      취소·싱크 보유 판정은 그대로 보존하며 새 제출 한도는 마지막 호출의 내부 조건임을 구분하세요. 최신 독립 지적: 마지막 재제출은 앞서 실패한 작업을 다시 시도한다는 뜻이 아닙니다. 영어는 resubmit 또는
      attempt submission으로 쓰고 retry는 쓰지 마세요. 올바른 기존 조건·순서·한도 guard·다른 라벨은 보존하세요.'
