  - id: configuration-implementation-observation
    topic: configuration-failure
    kind: flow
    title: 구성 호출의 실제 구현을 확인하는 조사 계획
    question: 상태 검사를 통과한 기존 호출에서 타입·구현·반환값을 관찰하는 계획입니다. 검증이나 구성을 다시 호출하지 않습니다.
    nodes:
