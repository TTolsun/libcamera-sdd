    nodes:
    - id: timeout
      label: '펜스 미신호: 요청 타임아웃'
      label_en: 'Unsignalled fence: request times out'
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: isn't signalled
    - id: retained
      label: 버퍼에 펜스가 남음
      label_en: Buffer still contains its fence
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: The buffer will still contain the fence
    - id: retrieve
      label: 애플리케이션이 releaseFence()로 회수
      label_en: Application retrieves with releaseFence()
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: applications must retrieve with FrameBuffer::releaseFence()
    - id: reuse
      label: 다른 요청의 재사용에 필요한 회수 조건
      label_en: Required retrieval condition for reuse in another request
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: can be reused in another request.
    edges:
    - from: timeout
      to: retained
      label: 요청 실패 뒤에도 유지
      label_en: Remains after request failure
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: "If the \\a fence associated with \\a buffer isn't signalled, the request\
          \ will\n * fail after a timeout. The buffer will still contain the fence,\
          \ which\n * applications must retrieve with FrameBuffer::releaseFence()\
          \ before the buffer\n * can be reused in another request."
    - from: retained
      to: retrieve
      label: 재사용 전 회수 의무
      label_en: Must retrieve before reuse
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: "If the \\a fence associated with \\a buffer isn't signalled, the request\
          \ will\n * fail after a timeout. The buffer will still contain the fence,\
          \ which\n * applications must retrieve with FrameBuffer::releaseFence()\
          \ before the buffer\n * can be reused in another request."
    - from: retrieve
      to: reuse
      label: 회수는 필요한 선행 조건
      label_en: Retrieval is a necessary precondition
      evidence:
      - source: resources/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: "If the \\a fence associated with \\a buffer isn't signalled, the request\
          \ will\n * fail after a timeout. The buffer will still contain the fence,\
          \ which\n * applications must retrieve with FrameBuffer::releaseFence()\
          \ before the buffer\n * can be reused in another request."
