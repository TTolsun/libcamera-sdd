  - id: stop-device-observation-plan
    topic: stopping
    kind: flow
    title: stopDevice 호출 구간의 관찰 계획
    question: 분리 직후, 호출 직전, 실제 구현 진입과 복귀를 각각 관찰하는 조사 계획입니다. 호출 직전 표시만으로 구현 진입이나 멎은
      원인을 확정하지 않습니다.
