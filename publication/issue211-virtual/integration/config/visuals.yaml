  official-cam-validation:
  - id: submission-gate
    topic: initial-preparation
    kind: decision
    title: 초기 요청들의 준비 반복과 준비 완료
    generation: llm
    max_nodes: 7
    required_symbols:
    - allocate
    - createRequest
    - addBuffer
    - requests_
    - nbuffers
    question: 기록된 단일 스트림·출력 싱크 미요청 구성에서 모든 초기 요청·버퍼는 카메라 시작 전에 어떻게 준비되며 준비 실패는 어떻게
      처리됩니까?
    sources:
    - cam-preparation
    max_label_chars: 64
    condition_display: evidence
    require_connected: true
    prompt: '현재 그래프 구조·노드 수·간선·심볼·실제 조건 양쪽·인용을 보존하고 지정한 라벨만 수정합니다. 다른 라벨은 유지합니다. err_return은
      오류 값 반환과 카메라 시작 전 종료라는 결과만 명시합니다. err_return의 라벨에 할당·생성·연결 실패 조건을 반복하지 않습니다.
      그 조건들은 각각 앞 결정 노드에서 설명합니다. 나머지 노드와 간선은 모두 유지합니다. 실제 검토 지적: ["가상 프레임 경로 그림의 “정상:
      FrameSuccess 설정” / “Sets FrameSuccess”는 생성 결과를 확인한 뒤 성공 상태를 설정하는 것처럼 보입니다. 소스는
      생성 호출 전에 FrameSuccess로 초기화하고, 생성이 실패하면 FrameError로 바꿉니다. 두 언어 그림의 순서를 수정하세요.",
      "가상 프레임 경로의 취소 분기에서 한국어 “취소 완료는 RequestCancelled”에 대응하는 영어 “Cancelled completion”은
      요청의 상태를 명시하지 않습니다. 영어 그림에도 RequestCancelled 상태와 큐 앞에서부터 통지하는 관계를 표시하세요.", "초기
      요청 준비 그림의 “버퍼 연결이 실패했는가?”와 “할당·생성·연결 실패 시 오류 값 반환”, 완료 순서 그림의 “Pending: 보류”와
      “맨 앞 RequestPending: 뒤 요청 통지 보류, 반복 중단”은 조건과 결과를 간선과 노드에서 반복합니다. 한국어와 영어 라벨을
      줄이되 오류 반환과 순서 보류 조건은 유지하세요."] 다음은 native 편집 대상 초안입니다: {"nodes":[{"id":"alloc_check","symbol":"allocate","label":"스트림
      버퍼 할당 호출이 실패했는가?","label_en":"Did the stream buffer allocation call fail?","shape":"decision","quote_ids":["cam-preparation:1"]},{"id":"err_return","symbol":"allocate","label":"할당·생성·연결
      실패 시 오류 값 반환, 카메라 시작 전 종료","label_en":"Alloc, create or attach fails: return
      error before camera start","shape":"box","quote_ids":["cam-preparation:1","cam-preparation:4","cam-preparation:6"]},{"id":"more_requests","symbol":"nbuffers","label":"준비할
      초기 요청이 남았는가?","label_en":"Are there initial requests left to prepare?","shape":"decision","quote_ids":["cam-preparation:4","cam-preparation:8"]},{"id":"create_req","symbol":"createRequest","label":"요청
      생성이 실패했는가?","label_en":"Did request creation fail?","shape":"decision","quote_ids":["cam-preparation:4"]},{"id":"attach_buf","symbol":"addBuffer","label":"버퍼
      연결이 실패했는가?","label_en":"Did attaching the buffer fail?","shape":"decision","quote_ids":["cam-preparation:6"]},{"id":"store_req","symbol":"requests_","label":"모든
      스트림 연결 뒤 현재 요청을 보관","label_en":"After all streams attach, keep the current request","shape":"process","quote_ids":["cam-preparation:5","cam-preparation:7","cam-preparation:8"]},{"id":"ready_done","symbol":"requests_","label":"모든
      초기 요청·버퍼 준비 완료, 카메라 시작 전 단계 종료","label_en":"All initial requests and buffers
