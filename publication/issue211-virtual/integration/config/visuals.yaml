    - id: call
      label: '계획: 실제 stopDevice 구현 진입을 별도 관찰'
      label_en: 'Plan: separately observe entry into the actual stopDevice implementation'
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: \fn PipelineHandler::stopDevice()
    - id: after
      label: '계획: 호출에서 돌아온 뒤 위치'
      label_en: 'Plan: source position after the call returns'
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "stopDevice(camera);\n\n\t/* Cancel and signal as complete all waiting\
          \ requests. */"
    - id: unreturned
      label: '계획: 관찰 창에서 복귀 미관찰 → 추가 조사(원인 미확정)'
      label_en: 'Plan: no observed return in observation window → investigate; cause
        unresolved'
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: stopDevice(camera);
    - id: implementation-return
      label: '계획: 실제 stopDevice 구현 복귀 이벤트 관찰 (구현 미검토, 측정 결과 아님)'
      label_en: 'Plan: observe the actual stopDevice implementation return event (implementation
        not reviewed, not a measured result)'
      evidence: &id001
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: \fn PipelineHandler::stopDevice()
    edges:
    - from: detach
      to: before
      label: 다음 stopDevice 호출 전 지점과 비교
      label_en: Compare with the position before the following stopDevice call
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: waitingRequests.swap(data->waitingRequests_);
    - from: before
      to: call
      label: 호출 지점과 실제 구현 진입을 구분
      label_en: Distinguish call site from actual implementation entry
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: stopDevice(camera);
    - from: call
      to: implementation-return
      label: 진입 뒤 반환이 관찰된 경우
      label_en: If a return is observed after entry
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "stopDevice(camera);\n\n\t/* Cancel and signal as complete all waiting\
          \ requests. */"
    - from: call
      to: unreturned
      label: 진입은 관찰했으나 복귀 관찰이 없으면
