defaults:
  depth: 4
  hide:
    owners:
    - log
    - LogMessage
    - LogMessageAbortGuard
    - tracepoints
    names:
    - _d
    - _o
    - _log
    - isLogSeverityEnabled
    - stream
    - basename
    - toString
    - operator<<
scenarios:
- id: manager_start
  title: 카메라 탐색 (CameraManager::start)
  from: CameraManager::start()
  focus:
  - title: 관리자 시작
    names:
    - start
    src: CameraManager
- id: configure
  title: 스트림 구성 (Camera::configure)
  from: Camera::configure(CameraConfiguration *)
  focus:
  - title: 구성 검증
    names:
    - validate
  - title: 파이프라인 구성 대상
    names:
    - configure
    src: Camera
- id: camera_start
  title: 캡처 시작 (Camera::start)
  from: Camera::start(const ControlList *)
  focus:
  - title: 시작 요청 대상
    names:
    - start
    src: Camera
  - title: 상태 반영
    names:
    - setState
    src: Camera
- id: queue_request
  title: 요청 제출 (Camera::queueRequest)
  from: Camera::queueRequest(Request *)
  focus:
  - title: 요청 상태 확인
    names:
    - status
    src: Camera
  - title: 요청 제출 대상
    names:
    - queueRequest
    src: Camera
  depth: 5
- id: complete_request
  title: 요청 완료 통지 (PipelineHandler::completeRequest)
  from: PipelineHandler::completeRequest(Request *)
  focus:
  - title: 완료 처리
    names:
    - complete
    src: PipelineHandler
  - title: 완료 통지
    names:
    - requestComplete
    src: PipelineHandler
  - title: 대기 요청 처리
    names:
    - doQueueRequests
    src: PipelineHandler
  - title: 하드웨어별 큐잉 후보
    names:
    - queueRequestDevice
    src: PipelineHandler
- id: camera_stop
  title: 캡처 종료 요청 (Camera::stop)
  from: Camera::stop()
  depth: 5
  focus:
  - title: 종료 상태 반영
    names:
    - setState
    src: Camera
  - title: 파이프라인 종료 대상
    names:
    - stop
    src: Camera
  - title: 종료 뒤 대기 요청 확인
    names:
    - hasPendingRequests
    src: Camera
