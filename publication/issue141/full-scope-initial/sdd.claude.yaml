agent:
  allow_direct_api: false
  api_key_env: SDD_AGENT_API_KEY
  args:
  - --provider
  - custom
  - --reasoning
  - high
  base_url: http://localhost:11434
  command: []
  full_style_guides: false
  kind: cli
  max_input_chars: 40000
  max_output_tokens: 1500
  model: qwen3.5:9b-ctx64k
  num_ctx: 0
  response_dir: ''
  runner: hermes
  temperature: 0.1
  think: false
  timeout_sec: 600
diagrams:
  direction: LR
  enabled: true
  max_nodes: 16
  strip_namespace: 'libcamera::'
documentation:
  enabled: true
  features:
  - id: request-lifecycle
    primary: request-lifecycle.md
    scenarios:
    - queue_request
    - complete_request
    - camera_stop
    sections:
    - camera-model
    - pipeline-handler
    symbols:
    - libcamera::Camera
    - libcamera::Request
    - libcamera::PipelineHandler
  - id: ipu3-lsc
    primary: ipu3-lsc-flow.md
    sections:
    - ipu3-lsc
    symbols:
    - libcamera::ipa::ipu3::algorithms::Lsc
  - id: rkisp1-dewarp
    primary: rkisp1-dewarp.md
    sections:
    - pipeline-handler
    symbols:
    - libcamera::RkISP1CameraData
    - libcamera::ConverterDW100Module
    - libcamera::Dw100VertexMap
  pages:
    camera-model.md:
      max_growth_ratio: 2.0
    component-index.md:
      max_markdown_chars: 250000
    ipa.md:
      max_growth_ratio: 2.0
    ipu3-lsc-flow.md:
      max_growth_ratio: 2.0
    overview.md:
      max_growth_ratio: 2.0
    pipeline-handler.md:
      max_growth_ratio: 2.0
    request-lifecycle.md:
      max_growth_ratio: 2.0
      max_markdown_chars: 160000
    rkisp1-dewarp.md:
      max_growth_ratio: 2.0
    vendor-integration.md:
      max_growth_ratio: 2.0
    vendor-overview.md:
      max_growth_ratio: 2.0
facts:
  package_depth: 3
output:
  diagrams_dir: /home/baboess/.cache/sdd-141-6b6c/run-full-coverage-141/manuscripts/diagrams
