  sdd_dir: /home/baboess/.cache/sdd-141-6b6c/run-full-coverage-141/manuscripts
paths:
  clang_uml_file: /home/baboess/.cache/sdd-141-6b6c/generator/examples/libcamera/config/clang-uml.yaml
  config: /home/baboess/.cache/sdd-141-6b6c/generator/examples/libcamera/config
