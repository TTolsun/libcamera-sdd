  - id: rpi-awb-branches
    topic: temperature
    kind: flow
    title: Raspberry Pi의 색온도 요청 분기
    question: Raspberry Pi IPA는 색온도 값을 받으면 언제 적용합니까?
    nodes:
    - id: request
      label: 요청에 ColourTemperature가 있음
      label_en: Request contains ColourTemperature
