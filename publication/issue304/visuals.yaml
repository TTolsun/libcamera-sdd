        sha256: 76ca45fd660615f583ca4502c7c3dcce4cc95ca517f86ad4038ed57bb8188505
        quote: if (colourTemperature)
    - id: mono
      label: 값을 무시함
      label_en: Value ignored
      evidence:
      - source: temperature/rpi-request
        sha256: 76ca45fd660615f583ca4502c7c3dcce4cc95ca517f86ad4038ed57bb8188505
        quote: if (monoSensor_)
    - id: missing
      label: 경고를 기록하고 적용을 건너뜀
      label_en: Warning logged and application skipped
      evidence:
      - source: temperature/rpi-request
        sha256: 76ca45fd660615f583ca4502c7c3dcce4cc95ca517f86ad4038ed57bb8188505
        quote: if (!awb) {
    - id: manual
      label: 색온도를 전달하고 AWB를 수동으로 전환
      label_en: Set temperature and switch AWB to manual
