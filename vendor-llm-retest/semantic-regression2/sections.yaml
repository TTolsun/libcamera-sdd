  group: For Vendor
  title: 연동 가이드
  output: regression-shutdown-device.md
  kind: prose
  lead: 연동 순서와 구현 책임을 확인하고 설정·요청·정지 계약을 적용하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  design_generation: llm
  semantic_review: true
  show_evidence: true
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandlerIPU3
    - libcamera::PipelineHandlerRkISP1
    - libcamera::Camera
    - libcamera::IPAManager
    class_table: false
  diagram:
    max_nodes: 24
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/camera_manager.cpp
  - src/ipa/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa_manager.h
  - src/libcamera/camera.cpp
  design_requirements:
  - id: shutdown
    question: 정지 시 공통 코드와 하드웨어 구현은 무엇을 끝내야 합니까?
    aspects:
    - completion
    - failure
  design_topics:
  - id: shutdown
    title: 정지와 오류 처리의 책임
    question: 공통 stop과 하드웨어별 stopDevice의 책임을 나누고 대기 요청과 장치 요청이 종료되는 조건을 설명하세요.
    covers:
    - shutdown
    sources:
    - id: stop
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Stop capturing from all running streams and cancel pending requests
      end: \brief Determine if the camera has any requests pending
    parts:
    - id: device
      question: stopDevice 선언의 계약만 설명하세요. 장치 구현자가 캡처·요청 처리를 중단하고 남은 요청을 취소하여 오류 상태로
        완료해야 하는 의무입니다. 구체 장치 코드나 실행 결과는 이 발췌에 없습니다.
      sources:
      - stop
      answer_contract:
        basis: contract
        required_terms:
        - - stopDevice
        - - 취소
        - - 오류
        reject_patterns: []
