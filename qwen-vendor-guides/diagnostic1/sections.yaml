sections:
- id: vendor-overview-value-purpose
  group: For Vendor
  nav_section: 도입 판단
  title: libcamera 제품 개요
  output: vendor-overview-value-purpose.md
  kind: prose
  lead: 제공 기능과 공통 설계의 강점을 확인하고 도입할 범위를 판단하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  design_generation: llm
  semantic_review: true
  show_evidence: true
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandlerIPU3
    - libcamera::PipelineHandlerRkISP1
    - libcamera::Camera
    - libcamera::IPAManager
    class_table: false
  diagram:
    max_nodes: 24
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/camera_manager.cpp
  - src/ipa/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa_manager.h
  - src/libcamera/camera.cpp
  - Documentation/introduction.rst
  design_requirements:
  - id: value
    question: 어떤 고객 문제를 해결하며 어떤 환경을 대상으로 합니까?
    aspects:
    - benefits
  design_topics:
  - id: value
    title: 복잡한 카메라를 공통 API로 제어하기
    question: Linux 기반 카메라의 하드웨어 구성과 이미지 제어 알고리즘을 공통 방법으로 다루는 가치를 설명하세요. 제품 성능이나 지원
      기종을 보장하지 마세요.
    covers:
    - value
    sources:
    - id: introduction
      file: Documentation/introduction.rst
      start: libcamera provides a complete camera stack for Linux-based systems to
        abstract
      end: operations to a simple and consistent method for developers.
    parts:
    - id: purpose
      question: libcamera가 Linux에서 추상화하는 하드웨어 구성·이미지 제어 알고리즘과 개발자에게 제공하는 사용 방식을 설명하세요.
        커널 API를 사용하는 내부 작업과 개발자가 사용하는 추상화를 구분하세요. 제품 성능이나 기종은 이 질문의 범위가 아닙니다.
      sources:
      - introduction
      answer_contract:
        basis: description
        required_terms:
        - - Linux
        - - libcamera
        reject_patterns: []
  routes:
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-integration.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  - q: 장치별 파이프라인을 구현합니다.
    to: pipeline-handler.md
  next:
    title: 연동 가이드
    link: vendor-integration.md
